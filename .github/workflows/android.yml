name: Build APK

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: write   # per pubblicare le release con l'APK

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4

      - name: Configurazione Firebase
        env:
          GOOGLE_SERVICES_JSON: ${{ secrets.GOOGLE_SERVICES_JSON }}
        run: |
          if [ -n "$GOOGLE_SERVICES_JSON" ]; then
            echo "$GOOGLE_SERVICES_JSON" > app/google-services.json
            echo "HAS_FIREBASE=true" >> "$GITHUB_ENV"
            echo "Uso il google-services.json dal secret."
          else
            cp app/google-services.json.example app/google-services.json
            echo "::warning::Secret GOOGLE_SERVICES_JSON assente: l'APK compila ma non si collegherà a Firebase."
          fi

      - name: Compila
        env:
          VERSION_CODE: ${{ github.run_number }}
        run: ./gradlew --no-daemon assembleDebug

      - uses: actions/upload-artifact@v4
        with:
          name: scado-apk
          path: app/build/outputs/apk/debug/*.apk

      # L'app controlla l'ultima release per aggiornarsi da sola. Pubblico solo
      # le build del branch principale e solo se collegate a Firebase.
      - name: Pubblica release
        if: >-
          github.event_name != 'pull_request' &&
          github.ref_name == github.event.repository.default_branch &&
          env.HAS_FIREBASE == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          BUILD: ${{ github.run_number }}
        run: |
          cp app/build/outputs/apk/debug/app-debug.apk scado.apk
          git log -1 --pretty=%B | grep -v -E '^(Co-Authored-By|Claude-Session):' > notes.txt
          gh release create "v$BUILD" scado.apk \
            --title "Scado 1.0.$BUILD" \
            --notes-file notes.txt \
            --target "$GITHUB_SHA"
